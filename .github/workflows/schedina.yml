name: Pubblica SchedAI

on:
  push:
    branches: [main]
  schedule:
    # Corsa di riferimento per lo storico ufficiale:
    # 06:30 UTC = 07:30/08:30 in Italia (ora solare/legale)
    - cron: '30 6 * * *'
  # Lancio manuale: ripubblica solo la pagina.
  workflow_dispatch:

permissions: {}

concurrency:
  group: schedina
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test del modello
        run: node --test 'scripts/test/*.test.mjs'

      # Storico ufficiale: la schedina di riferimento si scrive solo dalla
      # corsa programmata, mai da un push o da un lancio manuale.
      - name: Corsa di riferimento
        if: github.event_name == 'schedule'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "Secret API_FOOTBALL_KEY non impostato: salto lo storico ufficiale."
          else
            node scripts/generate.mjs
          fi

      - name: Salva storico nel repository
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Schedina del $(TZ=Europe/Rome date +%F)"
            git push
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
