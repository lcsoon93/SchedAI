name: Schedina del giorno

on:
  schedule:
    # 06:30 UTC = 07:30/08:30 in Italia (ora solare/legale)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Data da analizzare (AAAA-MM-GG, vuoto = oggi)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: schedina
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test del modello
        run: node --test 'scripts/test/*.test.mjs'

      - name: Analisi del palinsesto
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            node scripts/generate.mjs --date "$DATE_INPUT"
          else
            node scripts/generate.mjs
          fi

      - name: Salva storico nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Schedina del $(TZ=Europe/Rome date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
